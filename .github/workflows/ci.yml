name: Native checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official action commit
        with:
          persist-credentials: false
      - name: Test deterministic engine and app state
        run: swift test --jobs 2
      - name: Build all four canonical release editions
        run: |
          ./scripts/build.sh replica
          ./scripts/build.sh baseline-plus
          ./scripts/build.sh pip
          ./scripts/build.sh pip-plus
